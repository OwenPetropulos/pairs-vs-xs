name: backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pvx/**", "run.py", "tests.py", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ hashFiles('pvx/config.py') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('pvx/config.py') }}-
      - run: python tests.py
      - run: python run.py 2>&1 | tee results_log.txt
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit results
        run: |
          mkdir -p results && mv results_log.txt results/run_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Backtest results [skip ci]" || echo "no changes"
          git push
